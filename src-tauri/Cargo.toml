[package]
name = "pixelair"
version = "0.1.0"
description = "Lightweight desktop image optimizer"
authors = ["luisfalconmx"]
license = "MIT"
repository = "https://github.com/luisfalconmx/pixelair"
edition = "2021"
rust-version = "1.77.2"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows
name = "pixelair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
